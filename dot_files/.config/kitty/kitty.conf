# ~/.config/kitty/kitty.conf
# Konfigurasi Kitty - Tema One Dark, transparan (FIXED, tanpa background_blur bermasalah)

# =========================
# DISPLAY SERVER (penting! sesuai config lama yang terbukti jalan)
# =========================
linux_display_server x11

# =========================
# FONT
# =========================
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 10.0
adjust_line_height  100%
disable_ligatures never

# =========================
# TRANSPARANSI (tanpa background_blur — itu penyebab bug)
# =========================
background_opacity 0.85
dynamic_background_opacity yes

# =========================
# WINDOW / LAYOUT
# =========================
window_padding_width 10
remember_window_size  yes
initial_window_width  1000
initial_window_height 600
hide_window_decorations no
confirm_os_window_close 0

# =========================
# TAB BAR
# =========================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

# =========================
# CURSOR
# =========================
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# =========================
# SCROLLBACK
# =========================
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# =========================
# MOUSE
# =========================
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart

# =========================
# SHELL
# =========================
shell /usr/bin/zsh
shell_integration enabled

# =========================
# PERFORMA
# =========================
repaint_delay 8
input_delay 3
sync_to_monitor yes
enable_audio_bell no

# =========================
# WARNA - TEMA ONE DARK
# =========================
background            #282c34
foreground             #abb2bf
cursor                 #528bff
cursor_text_color      #282c34
selection_background   #2f4470
selection_foreground   #abb2bf

url_color #61afef
url_style curly

active_tab_background   #282c34
active_tab_foreground   #61afef
inactive_tab_background #21252b
inactive_tab_foreground #5c6370

# black
color0  #282c34
color8  #5c6370
# red
color1  #e06c75
color9  #e06c75
# green
color2  #98c379
color10 #98c379
# yellow
color3  #e5c07b
color11 #e5c07b
# blue
color4  #61afef
color12 #61afef
# magenta
color5  #c678dd
color13 #c678dd
# cyan
color6  #56b6c2
color14 #56b6c2
# white
color7  #abb2bf
color15 #ffffff

# =========================
# KEYBINDINGS
# =========================
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+shift+enter new_window
map ctrl+shift+d new_window_with_cwd

map ctrl+shift+r load_config_file
map ctrl+shift+f5 load_config_file

map ctrl+shift+f search_forward
map ctrl+shift+b search_backward

# atur opacity langsung dari keyboard, tanpa edit config
map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default
