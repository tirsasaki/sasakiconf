# ~/.config/alacritty/alacritty.toml
# Konfigurasi Alacritty LENGKAP & MODERN (format TOML, sesuai Alacritty 0.13+)
# Tema One Dark, background transparan, cocok untuk KDE Plasma di CachyOS

# =========================
# GENERAL
# =========================
[general]
live_config_reload = true
working_directory = "None"

[env]
TERM = "xterm-256color"

# =========================
# WINDOW
# =========================
[window]
opacity = 0.85
blur = true
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "full"
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
resize_increments = true

[window.dimensions]
columns = 120
lines = 30

# =========================
# SCROLLING
# =========================
[scrolling]
history = 10000
multiplier = 3

# =========================
# FONT
# =========================
[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# =========================
# WARNA - TEMA ONE DARK
# =========================
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#282c34"
foreground = "#abb2bf"
dim_foreground = "#828997"
bright_foreground = "#abb2bf"

[colors.cursor]
text = "#282c34"
cursor = "#528bff"

[colors.vi_mode_cursor]
text = "#282c34"
cursor = "#528bff"

[colors.selection]
text = "CellForeground"
background = "#3e4451"

[colors.search.matches]
foreground = "CellBackground"
background = "#98c379"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#e5c07b"

[colors.footer_bar]
background = "#282c34"
foreground = "#abb2bf"

[colors.normal]
black = "#282c34"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#abb2bf"

[colors.bright]
black = "#5c6370"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#ffffff"

[colors.dim]
black = "#282c34"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#abb2bf"

# =========================
# CURSOR
# =========================
[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = "None"
blink_interval = 600
blink_timeout = 5
unfocused_hollow = true
thickness = 0.15

# =========================
# MOUSE
# =========================
[mouse]
hide_when_typing = true

# =========================
# SHELL
# =========================
[terminal]
shell = { program = "/usr/bin/zsh" }

# =========================
# KEYBINDINGS
# =========================
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

# =========================
# HINTS (klik URL langsung buka browser)
# =========================
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "xdg-open"
post_processing = true

[hints.enabled.mouse]
enabled = true
mods = "None"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"
